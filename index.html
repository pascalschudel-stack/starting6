<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volleyball Team Builder</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#C04A17">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Bibliothek für den PDF Export (lokal eingebettet für Offline-Nutzung) -->
    <script src="vendor/html2pdf.bundle.min.js"></script>

    <style>
        /* --- Schriften, lokal eingebettet (kein Google-Abruf, funktioniert offline) --- */
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; font-display: swap;
            src: url(vendor/fonts/barlow-400-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; font-display: swap;
            src: url(vendor/fonts/barlow-400-latin-ext.woff2) format('woff2');
            unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 600; font-display: swap;
            src: url(vendor/fonts/barlow-600-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 600; font-display: swap;
            src: url(vendor/fonts/barlow-600-latin-ext.woff2) format('woff2');
            unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 700; font-display: swap;
            src: url(vendor/fonts/barlow-700-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 700; font-display: swap;
            src: url(vendor/fonts/barlow-700-latin-ext.woff2) format('woff2');
            unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F, U+A720-A7FF; }
        @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 700; font-display: swap;
            src: url(vendor/fonts/barlow-condensed-700-latin.woff2) format('woff2'); }

        /* --- Farbtokens: ein Grundton, ein Akzent, vier Rollenfarben --- */
        :root {
            --bg: #F6F4F0;
            --surface: #FFFFFF;
            --surface-2: #EFEBE4;
            --ink: #17181C;
            --ink-soft: #4A4E57;
            --ink-muted: #5B5F68;
            --line: #DDD8D0;
            --accent: #C04A17;
            --accent-dark: #93360F;
            --court: #EBD9BE;
            --court-line: #C9A878;
            --court-empty: #F7F2EA;
            --court-label: #7A6038;
            --danger: #B3261E;
            --danger-bg: #FBE4E2;
            --ok: #15706B;
            --role-zs: #2563A8;
            --role-aa: #C04A17;
            --role-mb: #15706B;
            --role-d:  #6D28A8;
            --role-l:  #A21758;
            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 18px;
        }

        body {
            font-family: 'Barlow', system-ui, -apple-system, sans-serif;
            display: flex; gap: 20px; padding: 20px; margin: 0;
            background-color: var(--bg); color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        /* Umschalter Feld / Kader – nur am Handy sichtbar */
        .view-switch { display: none; }
        .view-tab {
            height: 42px; border: none; border-radius: 999px; background: transparent;
            color: var(--ink-soft); font-family: inherit; font-size: 0.95em; font-weight: 600; cursor: pointer;
        }
        .view-tab.active { background: var(--accent); color: #fff; }

        /* Linker Bereich: Toolbar & Listen */
        #pool-container {
            width: 420px;
            background: var(--surface); padding: 16px; border-radius: var(--r-lg);
            display: flex; flex-direction: column; max-height: 90vh;
        }

        .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
        .controls { display: flex; gap: 8px; font-size: 0.9em; }
        .controls select {
            flex: 1; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r-sm);
            background: var(--surface); color: var(--ink-soft); font-family: inherit; font-weight: 600; cursor: pointer;
        }

        .btn-primary {
            width: 100%; min-height: 48px; padding: 10px 14px; background: var(--ink); color: #fff;
            border: none; border-radius: var(--r-md); cursor: pointer; font-family: inherit; font-size: 0.98em; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { background: #000; }
        .btn-secondary {
            width: 100%; min-height: 48px; padding: 10px 14px; background: var(--surface); color: var(--ink-soft);
            border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer;
            font-family: inherit; font-size: 0.98em; font-weight: 600; margin-top: 8px;
        }
        .btn-secondary:hover { background: var(--surface-2); }

        /* Listenbereiche */
        h3 { margin: 0 0 10px 0; font-size: 0.72em; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-muted); }

        #pool, #unavailable {
            overflow-y: auto; padding-right: 4px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start;
        }
        #pool { flex-grow: 1; min-height: 150px; margin-bottom: 16px; }
        #unavailable {
            min-height: 80px; max-height: 200px; margin-bottom: 16px;
            background: var(--surface-2); border: none; padding: 8px; border-radius: var(--r-md);
        }

        .player-card {
            background: var(--surface); border: 1px solid var(--line); padding: 10px;
            border-radius: var(--r-md); font-weight: 600; position: relative;
            transition: border-color 0.15s ease; box-sizing: border-box; text-align: left;
            min-width: 0;   /* sonst sprengen lange Namen das Raster */
        }
        #unavailable .player-card { background: #F7F5F1; }

        /* Nummer + Name stehen nebeneinander */
        .player-main { display: flex; align-items: baseline; gap: 7px; margin-bottom: 7px; margin-left: 26px; margin-right: 26px; pointer-events: none; }
        .player-number {
            font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-weight: 700;
            font-size: 1.25em; line-height: 1; color: var(--accent); flex-shrink: 0;
        }
        .player-number:empty { display: none; }
        .player-name { pointer-events: none; display: block; min-width: 0; font-size: 0.95em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        /* Im Feld: nur Nummer und Name, Nummer so gross wie möglich */
        #court-container .player-main { margin: 0; align-items: center; justify-content: center; gap: 8px; }
        /* bevorzugt am Leerzeichen umbrechen, nur bei zu langen Einzelwörtern im Wort */
        #court-container .player-name { margin: 0; white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: break-word; color: var(--ink-soft); }
        #court-container .player-number { font-size: clamp(1.5rem, 5.5vw, 2.6rem); line-height: 1; color: var(--ink); }

        /* Farbstreifen zeigt die Rolle, ohne zusätzlichen Text */
        /* Besetzte Position: der gestrichelte Rahmen der leeren Position verschwindet, die Karte übernimmt */
        #court .slot:has(.player-card), .libero-slot:has(.player-card) { border-color: transparent; background: transparent; }
        #court-container .player-card { width: 100%; margin: 0; text-align: center; overflow: hidden; padding-top: 13px; border-color: var(--line); }
        #court-container .player-card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--line);
        }
        #court-container .player-card[data-current-role="Zuspiel"]::before      { background: var(--role-zs); }
        #court-container .player-card[data-current-role="Außenangriff"]::before { background: var(--role-aa); }
        #court-container .player-card[data-current-role="Mittelblock"]::before  { background: var(--role-mb); }
        #court-container .player-card[data-current-role="Diagonal"]::before     { background: var(--role-d); }
        #court-container .player-card[data-current-role="Libero"]::before       { background: var(--role-l); }

        /* Badges */
        .role-badges { display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; }
        .badge { font-size: 0.68em; padding: 3px 8px; border-radius: 999px; border: none; font-weight: 600; }

        .badge-zs { background: #E3EDF8; color: #1B4E85; }
        .badge-zs.pref { background: var(--role-zs); color: #fff; }
        .badge-aa { background: #FBE8DF; color: #93360F; }
        .badge-aa.pref { background: var(--role-aa); color: #fff; }
        .badge-mb { background: #DEF0EE; color: #0F5853; }
        .badge-mb.pref { background: var(--role-mb); color: #fff; }
        .badge-d { background: #EDE4F7; color: #58208A; }
        .badge-d.pref { background: var(--role-d); color: #fff; }
        .badge-l { background: #FAE2EC; color: #841246; }
        .badge-l.pref { background: var(--role-l); color: #fff; }

        /* Rolle wird beim Zuweisen automatisch gesetzt und bleibt verborgen */
        .role-selector { display: none; }
        #court-container .role-badges { display: none; }
        #court-container .edit-btn { display: none; }

        /* Positionsbeschriftung ausblenden, sobald die Position besetzt ist */
        .slot:has(.player-card) .slot-title { display: none; }

        .edit-btn, .avail-btn {
            position: absolute; top: 4px; background: transparent; border: none; cursor: pointer;
            width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
            border-radius: var(--r-sm); color: var(--ink-muted); padding: 0;
        }
        .edit-btn { right: 4px; }
        .avail-btn { left: 4px; }
        .edit-btn:hover, .avail-btn:hover { background: var(--surface-2); color: var(--ink); }
        #unavailable .avail-btn { color: var(--ok); }
        #court-container .avail-btn { display: none; }

        /* Rechter Bereich: Match Info, Spielfeld & PDF */
        #court-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; }

        #export-area {
            display: flex; flex-direction: column; align-items: center;
            background: var(--surface); padding: 20px; border-radius: var(--r-lg);
            width: 100%; max-width: 650px; box-sizing: border-box;
        }

        /* Match Info Header */
        .match-header { display: flex; gap: 8px; width: 100%; margin-bottom: 24px; }
        .match-header input, .match-header select {
            padding: 10px; border: 1px solid var(--line); border-radius: var(--r-sm);
            font-family: inherit; font-size: 0.9em; font-weight: 600; color: var(--ink); background: var(--surface);
        }
        .match-header input::placeholder { color: var(--ink-muted); font-weight: 400; }
        #match-opponent { flex-grow: 1; min-width: 0; }
        #match-score { width: 90px; text-align: center; }

        #court {
            display: grid; grid-template-columns: repeat(3, 150px); grid-template-rows: repeat(2, 120px); gap: 8px;
            background: var(--court); padding: 14px; border-radius: var(--r-lg); position: relative;
            touch-action: pan-y;   /* senkrechtes Scrollen dem Browser, waagrechtes Wischen der App */
        }
        #court::before {
            content: "NETZ"; position: absolute; top: -24px; left: 0; right: 0; text-align: center;
            font-size: 0.64em; font-weight: 700; letter-spacing: 0.16em; color: var(--court-label);
            padding-bottom: 5px; border-bottom: 2px solid var(--court-line);
        }

        .slot {
            background: var(--court-empty); border: 1.5px dashed var(--court-line); border-radius: var(--r-md);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            min-height: 80px; cursor: pointer; transition: background 0.15s ease;
        }
        .slot:hover { background: #FCF8F2; }
        .slot-title {
            font-size: 0.68em; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
            color: var(--court-label); margin-bottom: 4px; pointer-events: none;
        }

        #libero-slot-container { margin-top: 18px; display: flex; gap: 12px; }
        .libero-slot { width: 150px; height: 92px; border-color: #D9AFC3; background: #FBF2F6; }
        .libero-slot .slot-title { color: #8C3A61; }

        .slot.warning { border-color: var(--danger); border-style: solid; background: var(--danger-bg); }
        .warning-icon { color: var(--danger); display: none; margin-top: 4px; pointer-events: none; line-height: 0; }
        .slot.warning .warning-icon { display: block; }

        /* Aktions-Buttons unterm Feld */
        .court-actions { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 650px; }
        .reset-group { display: flex; gap: 8px; }
        .action-group { display: flex; gap: 8px; width: 100%; }

        .rotate-group {
            display: flex; gap: 4px; align-items: center; justify-content: center;
            background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px;
        }
        .rotate-group .btn-reset {
            width: 44px; height: 44px; padding: 0; border: none; background: transparent;
            border-radius: 999px; flex-shrink: 0;
        }
        #rotation-info { font-size: 0.88em; color: var(--accent); font-weight: 600; min-width: 11em; text-align: center; }
        #rotation-info .rot-total { color: var(--ink-muted); font-weight: 500; }

        .btn-reset {
            font-size: 0.85em; padding: 10px 14px; min-height: 44px;
            background: var(--surface); color: var(--ink-soft); border: 1px solid var(--line); border-radius: var(--r-md);
            cursor: pointer; transition: background 0.15s ease; font-family: inherit; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        }
        .btn-reset:hover { background: var(--surface-2); color: var(--ink); }

        #btn-open-fullscreen {
            flex-grow: 1; min-height: 52px; font-size: 0.98em;
            background: var(--accent); color: #fff; border-color: var(--accent);
        }
        #btn-open-fullscreen:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
        #btn-export-pdf { width: 52px; min-height: 52px; flex-shrink: 0; padding: 0; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20,19,18,0.55); justify-content: center; align-items: center; z-index: 1000; padding: 16px; box-sizing: border-box; }
        .modal-content { background: var(--surface); padding: 20px; border-radius: var(--r-lg); width: 330px; max-width: 100%; box-sizing: border-box; }
        .modal-content h3 { margin-top: 0; margin-bottom: 16px; font-size: 1.1em; font-weight: 600; letter-spacing: -0.01em; text-transform: none; color: var(--ink); }
        .modal-content input[type="text"], .modal-content input[type="number"] {
            width: 100%; padding: 11px 12px; margin-bottom: 12px; border: 1px solid var(--line);
            border-radius: var(--r-sm); box-sizing: border-box; font-family: inherit; font-size: 0.98em; color: var(--ink);
        }
        .modal-content input::placeholder { color: var(--ink-muted); }

        .role-matrix { display: grid; grid-template-columns: 3fr 1fr 1fr; gap: 8px 5px; margin: 6px 0 18px; font-size: 0.9em; text-align: center; align-items: center; }
        .role-matrix .header { font-weight: 700; color: var(--ink-muted); font-size: 0.72em; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
        .role-matrix .role-label { text-align: left; font-weight: 600; }
        .role-matrix input[type="checkbox"] { cursor: pointer; width: 18px; height: 18px; accent-color: var(--accent); }

        #position-modal .modal-content { width: 350px; max-height: 80vh; overflow-y: auto; }
        .position-current-player { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface-2); border-radius: var(--r-md); padding: 10px 12px; margin-bottom: 14px; font-weight: 600; }
        .position-current-player button { width: auto; margin: 0; padding: 8px 12px; min-height: 40px; font-size: 0.85em; }
        .candidate-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .candidate-row {
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            width: 100%; min-height: 48px; text-align: left; background: var(--surface);
            border: 1px solid var(--line); border-radius: var(--r-md);
            padding: 10px 12px; cursor: pointer; font-family: inherit; font-size: 0.95em; font-weight: 600; color: var(--ink);
        }
        .candidate-row:hover { background: #FDF6F2; border-color: var(--accent); }
        .candidate-number {
            display: inline-block; min-width: 1.5em; margin-right: 8px; color: var(--accent);
            font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-weight: 700; font-size: 1.25em;
        }
        .candidate-empty { color: var(--ink-muted); font-size: 0.9em; text-align: center; margin-bottom: 16px; }

        /* --- Grossanzeige (Wisch nach links) --- */
        #fullscreen-view { display: none; position: fixed; inset: 0; background: #121317; z-index: 2000; overflow: hidden; touch-action: none; }
        #fullscreen-view.open { display: block; }

        /* Hochformat: Inhalt um 90 Grad drehen, Breite/Hoehe getauscht */
        #fullscreen-stage {
            position: absolute; top: 50%; left: 50%;
            width: 100vh; height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            padding: 2.4vh; box-sizing: border-box;
        }

        #fullscreen-court {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
            gap: 1.6vh; width: 100%; height: 100%;
        }

        .fs-slot {
            background: #1E2027; border-radius: 1.6vh; overflow: hidden; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 1vh; box-sizing: border-box;
        }
        .fs-slot::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 0.5vh; min-height: 3px; background: #32363F; }
        .fs-slot[data-role="Zuspiel"]::before      { background: #5B9BE0; }
        .fs-slot[data-role="Außenangriff"]::before { background: #E8783F; }
        .fs-slot[data-role="Mittelblock"]::before  { background: #3FA99C; }
        .fs-slot[data-role="Diagonal"]::before     { background: #A077D8; }
        .fs-slot[data-role="Libero"]::before       { background: #DC6A9E; }
        .fs-slot.empty { background: #191B21; }
        .fs-slot.empty::before { background: #262930; }

        .fs-number { font-family: 'Barlow Condensed', 'Barlow', sans-serif; font-weight: 700; line-height: 0.9; letter-spacing: -0.01em; color: #FFFFFF; font-size: min(26vh, 32vw); }
        .fs-name { font-weight: 600; color: #C3C8D0; margin-top: 0.8vh; font-size: min(3.2vh, 4.6vw); overflow-wrap: break-word; }
        .fs-name-only { font-size: min(7vh, 11vw); margin-top: 0; color: #FFFFFF; }
        .fs-empty-label { color: #6E737D; font-weight: 600; font-size: min(2.6vh, 4vw); }

        #btn-close-fullscreen {
            position: absolute; top: 1.2vh; right: 1.2vh; z-index: 1;
            width: 5.2vh; height: 5.2vh; min-width: 44px; min-height: 44px;
            display: flex; align-items: center; justify-content: center;
            border: none; border-radius: 50%; cursor: pointer;
            background: #1E2027; color: #D5D8DD;
        }

        /* Querformat-Bildschirme (Tablet/Desktop): nicht drehen, Einheiten tauschen */
        @media (orientation: landscape) {
            #fullscreen-stage { width: 100vw; height: 100vh; transform: translate(-50%, -50%); padding: 2.4vw; }
            #fullscreen-court { gap: 1.6vw; }
            .fs-slot { border-radius: 1.6vw; padding: 1vw; }
            .fs-slot::before { height: 0.5vw; }
            .fs-number { font-size: min(32vh, 26vw); }
            .fs-name { margin-top: 0.8vw; font-size: min(4.6vh, 3.2vw); }
            .fs-name-only { font-size: min(11vh, 7vw); margin-top: 0; }
            .fs-empty-label { font-size: min(4vh, 2.6vw); }
            #btn-close-fullscreen { top: 1.2vw; right: 1.2vw; width: 5.2vw; height: 5.2vw; }
        }

        /* --- Mobile / Handy-Layout --- */
        @media (max-width: 700px) {
            body { flex-direction: column; padding: 10px; gap: 10px; }

            /* Umschalter: am Handy wird entweder das Feld oder der Kader gezeigt */
            .view-switch {
                display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
                background: var(--surface-2); border-radius: 999px; padding: 4px;
                width: 100%; box-sizing: border-box;
            }
            body[data-view="feld"] #pool-container { display: none; }
            body[data-view="kader"] #court-container { display: none; }

            #pool-container { width: 100%; max-height: none; box-sizing: border-box; }
            #court-container { width: 100%; }

            /* Kader am Handy als ruhige Zeilen statt gedrängter Zweispalter */
            #pool, #unavailable { grid-template-columns: 1fr; }

            #export-area { padding: 12px; max-width: 100%; box-sizing: border-box; }

            .match-header { flex-wrap: wrap; }
            .match-header input, .match-header select { flex: 1 1 45%; min-width: 0; }

            #court {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 6px; padding: 12px 8px 8px;
                width: 100%; box-sizing: border-box;
            }
            .slot { min-height: 72px; padding: 4px; }
            .slot-title { font-size: 0.7em; }
            #court-container .player-main { gap: 4px; }
            #court-container .player-name { font-size: 0.72em; }

            #libero-slot-container { width: 100%; gap: 10px; margin-top: 12px; }
            .libero-slot { width: 100%; height: 72px; }

            .court-actions { max-width: 100%; }
            .reset-group { width: 100%; }
            .reset-group .btn-reset { flex: 1; }
            .rotate-group { width: 100%; }
            #rotation-info { min-width: 0; flex: 1; font-size: 0.82em; }

            .player-card { min-height: 44px; }
            .btn-primary, .btn-secondary { min-height: 48px; }
        }
    </style>
</head>
<body data-view="feld">

    <!-- Umschalter Feld / Kader (nur am Handy sichtbar) -->
    <div class="view-switch">
        <button type="button" id="tab-feld" class="view-tab active">Feld</button>
        <button type="button" id="tab-kader" class="view-tab">Kader</button>
    </div>

    <!-- Linker Bereich -->
    <div id="pool-container">
        <div class="toolbar">
            <div class="controls">
                <select id="sort-by">
                    <option value="name">Sort.: A-Z</option>
                    <option value="position">Sort.: Position</option>
                </select>
                <select id="filter-pos">
                    <option value="all">Filter: Alle</option>
                    <option value="Zuspiel">Zuspiel</option>
                    <option value="Außenangriff">Außenangriff</option>
                    <option value="Mittelblock">Mittelblock</option>
                    <option value="Diagonal">Diagonal</option>
                    <option value="Libero">Libero</option>
                </select>
            </div>
        </div>

        <h3>Reserve</h3>
        <div id="pool" class="slot" style="border: none; background: transparent; cursor: default;"></div>

        <h3>Nicht verfügbar</h3>
        <div id="unavailable" class="slot" style="cursor: default;"></div>

        <button id="btn-open-add" class="btn-primary">+ Neue Spielerin</button>
    </div>

    <!-- Rechter Bereich -->
    <div id="court-container">

        <!-- Bereich der ins PDF gedruckt wird -->
        <div id="export-area">

            <!-- Match Info -->
            <div class="match-header">
                <input type="date" id="match-date">
                <input type="text" id="match-opponent" placeholder="Gegnerisches Team">
                <select id="match-set">
                    <option value="Satz1">Satz 1</option>
                    <option value="Satz2">Satz 2</option>
                    <option value="Satz3">Satz 3</option>
                    <option value="Satz4">Satz 4</option>
                    <option value="Satz5">Satz 5</option>
                </select>
                <input type="text" id="match-score" placeholder="Resultat">
            </div>

            <div id="court">
                <div class="slot" id="pos4" data-req="Diagonal"><div class="slot-title">Pos 4 (Diagonal)</div><div class="warning-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rolle passt nicht zur Position"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></div></div>
                <div class="slot" id="pos3" data-req="Mittelblock"><div class="slot-title">Pos 3 (Mitte)</div><div class="warning-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rolle passt nicht zur Position"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></div></div>
                <div class="slot" id="pos2" data-req="Außenangriff"><div class="slot-title">Pos 2 (Außen)</div><div class="warning-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rolle passt nicht zur Position"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></div></div>

                <div class="slot" id="pos5" data-req="Außenangriff"><div class="slot-title">Pos 5 (Außen)</div><div class="warning-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rolle passt nicht zur Position"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></div></div>
                <div class="slot" id="pos6" data-req="Mittelblock"><div class="slot-title">Pos 6 (Mitte)</div><div class="warning-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rolle passt nicht zur Position"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></div></div>
                <div class="slot" id="pos1" data-req="Zuspiel"><div class="slot-title">Pos 1 (Zuspiel)</div><div class="warning-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rolle passt nicht zur Position"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></div></div>
            </div>

            <div id="libero-slot-container">
                <div class="slot libero-slot" id="libero-slot-1" data-req="Libero"><div class="slot-title">Libero 1</div><div class="warning-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rolle passt nicht zur Position"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></div></div>
                <div class="slot libero-slot" id="libero-slot-2" data-req="Libero"><div class="slot-title">Libero 2</div><div class="warning-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Rolle passt nicht zur Position"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></div></div>
            </div>
        </div>

        <!-- Aktions-Buttons (Nicht im PDF) -->
        <div class="court-actions">
            <div class="rotate-group">
                <button id="btn-rotate-left" class="btn-reset" aria-label="Eine Position nach links drehen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
                <span id="rotation-info">Grundaufstellung</span>
                <button id="btn-rotate-right" class="btn-reset" aria-label="Eine Position nach rechts drehen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
            </div>
            <div class="reset-group">
                <button id="btn-reset-court" class="btn-reset"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Feld leeren</button>
                <button id="btn-reset-libero" class="btn-reset"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>Liberos leeren</button>
            </div>
            <div class="action-group">
                <button id="btn-open-fullscreen" class="btn-reset"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg>Grossanzeige</button>
                <button id="btn-export-pdf" class="btn-reset" aria-label="Aufstellung als PDF exportieren"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg></button>
            </div>
        </div>

    </div>

    <!-- Add/Edit Modal -->
    <div id="player-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">Neue Spielerin</h3>
            <input type="text" id="modal-name" placeholder="Name eingeben...">
            <input type="number" id="modal-number" placeholder="Rückennummer (optional)" min="0" max="99" inputmode="numeric">

            <div class="role-matrix" id="modal-matrix">
                <div></div><div class="header">Möglich</div><div class="header">Bevorzugt</div>
                <div class="role-label">Zuspiel</div><div><input type="checkbox" value="Zuspiel" class="chk-possible"></div><div><input type="checkbox" value="Zuspiel" class="chk-pref"></div>
                <div class="role-label">Außenangriff</div><div><input type="checkbox" value="Außenangriff" class="chk-possible"></div><div><input type="checkbox" value="Außenangriff" class="chk-pref"></div>
                <div class="role-label">Mittelblock</div><div><input type="checkbox" value="Mittelblock" class="chk-possible"></div><div><input type="checkbox" value="Mittelblock" class="chk-pref"></div>
                <div class="role-label">Diagonal</div><div><input type="checkbox" value="Diagonal" class="chk-possible"></div><div><input type="checkbox" value="Diagonal" class="chk-pref"></div>
                <div class="role-label">Libero</div><div><input type="checkbox" value="Libero" class="chk-possible"></div><div><input type="checkbox" value="Libero" class="chk-pref"></div>
            </div>

            <button id="btn-save-modal" class="btn-primary">Speichern</button>
            <button id="btn-cancel-modal" class="btn-secondary">Abbrechen</button>
        </div>
    </div>

    <!-- Position-Auswahl Modal -->
    <div id="position-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="position-modal-title">Position</h3>
            <div id="position-current"></div>
            <div id="position-candidates" class="candidate-list"></div>
            <button id="btn-cancel-position-modal" class="btn-secondary">Abbrechen</button>
        </div>
    </div>

    <!-- Grossanzeige: öffnet sich mit einem Wisch nach links über dem Spielfeld -->
    <div id="fullscreen-view">
        <div id="fullscreen-stage">
            <button id="btn-close-fullscreen" aria-label="Grossanzeige schliessen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
            <div id="fullscreen-court"></div>
        </div>
    </div>

    <script>
        let playerIdCounter = 1;
        let editingPlayerId = null;

        // --- Rotation ---
        // Rollen der Grundaufstellung. Beim Drehen wandert die Rolle mit der Spielerin mit,
        // die Positionsnummern bleiben an ihrem Platz im Feld.
        const BASE_ROLES = {
            pos1: 'Zuspiel',
            pos2: 'Außenangriff',
            pos3: 'Mittelblock',
            pos4: 'Diagonal',
            pos5: 'Außenangriff',
            pos6: 'Mittelblock'
        };
        const ROLE_SHORT = {
            'Zuspiel': 'Zuspiel',
            'Außenangriff': 'Außen',
            'Mittelblock': 'Mitte',
            'Diagonal': 'Diagonal'
        };
        let rotationOffset = 0;   // 0 = Grundaufstellung, 1..5 = gedreht

        // --- Symbole (gezeichnet statt Emoji: nehmen die Textfarbe an und sehen überall gleich aus) ---
        function svgIcon(paths, size) {
            return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"`
                 + ` stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
        }
        const ICONS = {
            edit:  svgIcon('<path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>', 15),
            block: svgIcon('<circle cx="12" cy="12" r="9"></circle><path d="m5.6 5.6 12.8 12.8"></path>', 15),
            check: svgIcon('<path d="M20 6 9 17l-5-5"></path>', 15)
        };

        // --- Core Functions & State Management ---
        function saveState() {
            const players = [];
            document.querySelectorAll('.player-card').forEach(card => {
                players.push({
                    id: card.id,
                    name: card.querySelector('.player-name').innerText,
                    number: card.getAttribute('data-number') || '',
                    roles: card.getAttribute('data-roles'),
                    prefs: card.getAttribute('data-prefs'),
                    location: card.parentElement.id,
                    currentRole: card.querySelector('.role-selector').value
                });
            });
            localStorage.setItem('vb_players', JSON.stringify(players));
            localStorage.setItem('vb_counter', playerIdCounter);
            localStorage.setItem('vb_rotation', rotationOffset);
        }

        function loadState() {
            const savedPlayers = JSON.parse(localStorage.getItem('vb_players')) || [];
            playerIdCounter = parseInt(localStorage.getItem('vb_counter')) || 1;

            // Drehstand zuerst anwenden, damit die Positionen beim Einsetzen schon die richtige Rolle haben
            rotationOffset = parseInt(localStorage.getItem('vb_rotation')) || 0;
            applyRotationLabels();

            savedPlayers.forEach(p => {
                const roles = p.roles.split(',');
                const prefs = p.prefs ? p.prefs.split(',') : [];
                createPlayerElement(p.id, p.name, roles, prefs, p.location, p.currentRole, p.number);
            });
            applyFilterAndSort();
        }

        // --- Date Initialisierung ---
        function setTodayDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('match-date').value = `${yyyy}-${mm}-${dd}`;
        }

        // --- UI Builder ---
        function getRoleClass(role) {
            const map = {
                'Zuspiel': 'badge-zs', 'Außenangriff': 'badge-aa', 'Mittelblock': 'badge-mb',
                'Diagonal': 'badge-d', 'Libero': 'badge-l'
            };
            return map[role] || '';
        }

        function buildBadgesHTML(rolesArray, prefsArray) {
            return rolesArray.map(role => {
                const isPref = prefsArray.includes(role);
                const roleClass = getRoleClass(role);
                return `<span class="badge ${roleClass} ${isPref ? 'pref' : ''}">${role.substring(0,4)}. ${isPref ? '★' : ''}</span>`;
            }).join('');
        }

        function createRoleOptions(rolesArray) {
            return rolesArray.map(role => `<option value="${role}">${role}</option>`).join('');
        }

        // Rückennummer auf Ziffern begrenzen (max. 2 Stellen), leer wenn nichts erfasst
        function cleanNumber(value) {
            return String(value || '').replace(/[^0-9]/g, '').slice(0, 2);
        }

        // Beschriftung für die Popup-Listen: Nummer (falls vorhanden) plus Name
        function playerLabel(card) {
            const number = card.getAttribute('data-number');
            const name = card.querySelector('.player-name').innerText;
            return number ? `<span class="candidate-number">${number}</span>${name}` : name;
        }

        function createPlayerElement(id, name, roles, prefs, locationId = 'pool', currentRole = null, number = '') {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.id = id;
            card.setAttribute('data-roles', roles.join(','));
            card.setAttribute('data-prefs', prefs.join(','));
            card.setAttribute('data-number', cleanNumber(number));

            card.innerHTML = `
                <button type="button" class="avail-btn" onclick="toggleAvailability('${id}', event)"></button>
                <button type="button" class="edit-btn" onclick="openModal('${id}', event)" aria-label="Spielerin bearbeiten">${ICONS.edit}</button>
                <div class="player-main">
                    <span class="player-number">${cleanNumber(number)}</span>
                    <span class="player-name">${name}</span>
                </div>
                <div class="role-badges">${buildBadgesHTML(roles, prefs)}</div>
                <select class="role-selector">${createRoleOptions(roles)}</select>
            `;

            if (currentRole && roles.includes(currentRole)) card.querySelector('.role-selector').value = currentRole;
            syncRoleAttr(card);

            const targetContainer = document.getElementById(locationId) || document.getElementById('pool');
            targetContainer.appendChild(card);
            updateAvailButton(card);

            if (targetContainer.id !== 'pool' && targetContainer.id !== 'unavailable') checkPositionWarning(targetContainer, card);
            return card;
        }

        function updateAvailButton(card) {
            const btn = card.querySelector('.avail-btn');
            if (!btn) return;
            const isUnavailable = card.parentElement && card.parentElement.id === 'unavailable';
            btn.innerHTML = isUnavailable ? ICONS.check : ICONS.block;
            const label = isUnavailable ? 'Als verfügbar markieren' : 'Als nicht verfügbar markieren';
            btn.title = label;
            btn.setAttribute('aria-label', label);
        }

        window.toggleAvailability = function(id, event) {
            if (event) event.stopPropagation();
            const card = document.getElementById(id);
            const pool = document.getElementById('pool');
            const unavailable = document.getElementById('unavailable');
            if (card.parentElement.id === 'unavailable') {
                pool.appendChild(card);
            } else if (card.parentElement.id === 'pool') {
                unavailable.appendChild(card);
            } else {
                return;
            }
            updateAvailButton(card);
            applyFilterAndSort();
            saveState();
        };

        // --- Filter & Sort Logic ---
        function applyFilterAndSort() {
            const filterVal = document.getElementById('filter-pos').value;
            const sortVal = document.getElementById('sort-by').value;

            ['pool', 'unavailable'].forEach(containerId => {
                const container = document.getElementById(containerId);
                if (!container) return;

                const cards = Array.from(container.querySelectorAll('.player-card'));
                cards.sort((a, b) => {
                    if (sortVal === 'name') return a.querySelector('.player-name').innerText.toLowerCase().localeCompare(b.querySelector('.player-name').innerText.toLowerCase());
                    return a.getAttribute('data-roles').localeCompare(b.getAttribute('data-roles'));
                });

                cards.forEach(card => {
                    const roles = card.getAttribute('data-roles').split(',');
                    card.style.display = (filterVal === 'all' || roles.includes(filterVal)) ? 'block' : 'none';
                    container.appendChild(card);
                });
            });
        }

        document.getElementById('filter-pos').addEventListener('change', applyFilterAndSort);
        document.getElementById('sort-by').addEventListener('change', applyFilterAndSort);

        // --- Modal (Add / Edit) ---
        const modal = document.getElementById('player-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalName = document.getElementById('modal-name');
        const modalNumber = document.getElementById('modal-number');
        const matrix = document.getElementById('modal-matrix');

        matrix.addEventListener('change', (e) => {
            if (e.target.classList.contains('chk-pref') && e.target.checked) e.target.parentElement.previousElementSibling.querySelector('.chk-possible').checked = true;
            if (e.target.classList.contains('chk-possible') && !e.target.checked) e.target.parentElement.nextElementSibling.querySelector('.chk-pref').checked = false;
        });

        document.getElementById('btn-open-add').addEventListener('click', () => openModal(null));
        document.getElementById('btn-cancel-modal').addEventListener('click', () => { modal.style.display = 'none'; });

        window.openModal = function(id, event) {
            if (event) event.stopPropagation();
            editingPlayerId = id;
            modalName.value = '';
            modalNumber.value = '';
            matrix.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);

            if (id) {
                modalTitle.innerText = "Spielerin bearbeiten";
                const card = document.getElementById(id);
                modalName.value = card.querySelector('.player-name').innerText;
                modalNumber.value = card.getAttribute('data-number') || '';
                const roles = card.getAttribute('data-roles').split(',');
                const prefs = card.getAttribute('data-prefs') ? card.getAttribute('data-prefs').split(',') : [];

                matrix.querySelectorAll('.chk-possible').forEach(cb => cb.checked = roles.includes(cb.value));
                matrix.querySelectorAll('.chk-pref').forEach(cb => cb.checked = prefs.includes(cb.value));
            } else {
                modalTitle.innerText = "Neue Spielerin";
            }
            modal.style.display = 'flex';
        };

        document.getElementById('btn-save-modal').addEventListener('click', () => {
            const name = modalName.value.trim();
            const number = cleanNumber(modalNumber.value);
            const roles = Array.from(matrix.querySelectorAll('.chk-possible:checked')).map(cb => cb.value);
            const prefs = Array.from(matrix.querySelectorAll('.chk-pref:checked')).map(cb => cb.value);

            if (!name) return alert('Bitte gib einen Namen ein.');
            if (roles.length === 0) return alert('Bitte wähle mindestens eine mögliche Position aus.');

            if (editingPlayerId) {
                const card = document.getElementById(editingPlayerId);
                const roleSelector = card.querySelector('.role-selector');
                const previousSelection = roleSelector.value;

                card.querySelector('.player-name').innerText = name;
                card.querySelector('.player-number').innerText = number;
                card.setAttribute('data-number', number);
                card.setAttribute('data-roles', roles.join(','));
                card.setAttribute('data-prefs', prefs.join(','));
                card.querySelector('.role-badges').innerHTML = buildBadgesHTML(roles, prefs);
                roleSelector.innerHTML = createRoleOptions(roles);

                if (roles.includes(previousSelection)) roleSelector.value = previousSelection;
                if (card.parentElement.id !== 'pool' && card.parentElement.id !== 'unavailable') checkPositionWarning(card.parentElement, card);
            } else {
                createPlayerElement('p' + playerIdCounter++, name, roles, prefs, 'pool', null, number);
            }

            modal.style.display = 'none';
            applyFilterAndSort();
            saveState();
        });

        // --- Positions-Auswahl (Klick statt Drag & Drop) ---
        const positionModal = document.getElementById('position-modal');
        const positionModalTitle = document.getElementById('position-modal-title');
        const positionCurrent = document.getElementById('position-current');
        const positionCandidates = document.getElementById('position-candidates');

        function getEligiblePlayers(slot) {
            const req = slot.getAttribute('data-req').split(',');
            return Array.from(document.querySelectorAll('#pool .player-card')).filter(card => {
                const roles = card.getAttribute('data-roles').split(',');
                return roles.some(r => req.includes(r));
            });
        }

        function openPositionModal(slot) {
            // textContent statt innerText: sonst übernimmt der Titel die Versalien aus dem CSS
            positionModalTitle.innerText = slot.querySelector('.slot-title').textContent;

            positionCurrent.innerHTML = '';
            const currentPlayer = slot.querySelector('.player-card');
            if (currentPlayer) {
                const row = document.createElement('div');
                row.className = 'position-current-player';
                row.innerHTML = `<span>${playerLabel(currentPlayer)}</span>`;

                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-reset';
                removeBtn.type = 'button';
                removeBtn.innerText = 'Entfernen';
                removeBtn.addEventListener('click', () => {
                    document.getElementById('pool').appendChild(currentPlayer);
                    updateAvailButton(currentPlayer);
                    applyFilterAndSort();
                    saveState();
                    closePositionModal();
                });
                row.appendChild(removeBtn);
                positionCurrent.appendChild(row);
            }

            const eligible = getEligiblePlayers(slot);
            positionCandidates.innerHTML = '';
            if (eligible.length === 0) {
                positionCandidates.innerHTML = '<p class="candidate-empty">Keine verfügbaren Spielerinnen für diese Position.</p>';
            } else {
                eligible.forEach(card => {
                    const roles = card.getAttribute('data-roles').split(',');
                    const prefs = card.getAttribute('data-prefs') ? card.getAttribute('data-prefs').split(',') : [];
                    const row = document.createElement('button');
                    row.type = 'button';
                    row.className = 'candidate-row';
                    row.innerHTML = `<span>${playerLabel(card)}</span><span class="role-badges">${buildBadgesHTML(roles, prefs)}</span>`;
                    row.addEventListener('click', () => assignPlayerToSlot(card, slot));
                    positionCandidates.appendChild(row);
                });
            }

            positionModal.style.display = 'flex';
        }

        function assignPlayerToSlot(card, slot) {
            const existingPlayer = slot.querySelector('.player-card');
            if (existingPlayer) document.getElementById('pool').appendChild(existingPlayer);

            const requiredRoles = slot.getAttribute('data-req').split(',');
            const roleSelector = card.querySelector('.role-selector');
            const possibleRoles = Array.from(roleSelector.options).map(o => o.value);
            if (!requiredRoles.includes(roleSelector.value)) {
                const match = possibleRoles.find(r => requiredRoles.includes(r));
                if (match) roleSelector.value = match;
            }

            slot.appendChild(card);
            checkPositionWarning(slot, card);
            saveState();
            closePositionModal();
        }

        function closePositionModal() {
            positionModal.style.display = 'none';
        }

        document.getElementById('btn-cancel-position-modal').addEventListener('click', closePositionModal);

        document.querySelectorAll('.slot').forEach(slot => {
            if (slot.id !== 'pool' && slot.id !== 'unavailable') {
                slot.addEventListener('click', (e) => {
                    if (['SELECT', 'BUTTON', 'OPTION'].includes(e.target.tagName)) return;
                    openPositionModal(slot);
                });
            }
        });

        document.addEventListener('change', (e) => {
            if (e.target.classList.contains('role-selector')) {
                const card = e.target.closest('.player-card');
                if (card.parentElement.id !== 'pool' && card.parentElement.id !== 'unavailable') checkPositionWarning(card.parentElement, card);
                saveState();
            }
        });

        // Die gespielte Rolle steht als Attribut auf der Karte – daraus kommt der Farbstreifen im Feld
        function syncRoleAttr(card) {
            const sel = card.querySelector('.role-selector');
            if (sel) card.setAttribute('data-current-role', sel.value);
        }

        function checkPositionWarning(slot, player) {
            syncRoleAttr(player);
            if (slot.id === 'pool' || slot.id === 'unavailable') { slot.classList.remove('warning'); return; }
            const required = slot.getAttribute('data-req').split(',');
            const selected = player.querySelector('.role-selector').value;
            slot.classList.toggle('warning', !required.includes(selected));
        }

        // --- Drehen (Rotation) ---
        // Welche Rolle gilt auf Position n beim aktuellen Drehstand?
        function roleForPosition(n) {
            const source = ((n - 1 + rotationOffset) % 6) + 1;
            return BASE_ROLES['pos' + source];
        }

        function applyRotationLabels() {
            for (let n = 1; n <= 6; n++) {
                const slot = document.getElementById('pos' + n);
                const role = roleForPosition(n);
                slot.setAttribute('data-req', role);
                slot.querySelector('.slot-title').innerText = `Pos ${n} (${ROLE_SHORT[role]})`;
                const card = slot.querySelector('.player-card');
                if (card) checkPositionWarning(slot, card);
            }
            const info = document.getElementById('rotation-info');
            info.innerHTML = rotationOffset === 0
                ? 'Grundaufstellung'
                : `Rotation ${rotationOffset + 1} <span class="rot-total">von 6</span>`;
        }

        // step = +1 im Uhrzeigersinn (Pos 2 rückt auf Pos 1), -1 zurück
        function rotateCourt(step) {
            // Erst alle Karten lösen, damit auch leere Positionen korrekt mitwandern
            const cards = {};
            for (let n = 1; n <= 6; n++) {
                const card = document.getElementById('pos' + n).querySelector('.player-card');
                cards[n] = card;
                if (card) card.remove();
            }
            for (let n = 1; n <= 6; n++) {
                const source = (((n - 1 + step) % 6) + 6) % 6 + 1;
                const card = cards[source];
                if (card) document.getElementById('pos' + n).appendChild(card);
            }

            rotationOffset = (((rotationOffset + step) % 6) + 6) % 6;
            applyRotationLabels();
            saveState();
        }

        document.getElementById('btn-rotate-right').addEventListener('click', () => rotateCourt(1));
        document.getElementById('btn-rotate-left').addEventListener('click', () => rotateCourt(-1));

        // --- Grossanzeige (Wisch nach links über dem Spielfeld) ---
        const fullscreenView = document.getElementById('fullscreen-view');
        const fullscreenCourt = document.getElementById('fullscreen-court');
        const FS_ORDER = [4, 3, 2, 5, 6, 1];   // gleiche Anordnung wie auf dem Spielfeld

        function buildFullscreenCourt() {
            fullscreenCourt.innerHTML = '';
            FS_ORDER.forEach(n => {
                const slot = document.getElementById('pos' + n);
                const card = slot.querySelector('.player-card');
                const cell = document.createElement('div');
                cell.className = 'fs-slot' + (card ? '' : ' empty');
                if (card) cell.setAttribute('data-role', card.getAttribute('data-current-role') || '');

                if (!card) {
                    const label = document.createElement('div');
                    label.className = 'fs-empty-label';
                    label.innerText = slot.querySelector('.slot-title').innerText;
                    cell.appendChild(label);
                } else {
                    const number = card.getAttribute('data-number') || '';
                    const name = card.querySelector('.player-name').innerText;
                    if (number) {
                        const num = document.createElement('div');
                        num.className = 'fs-number';
                        num.innerText = number;
                        cell.appendChild(num);
                    }
                    const nm = document.createElement('div');
                    nm.className = 'fs-name' + (number ? '' : ' fs-name-only');
                    nm.innerText = name;
                    cell.appendChild(nm);
                }
                fullscreenCourt.appendChild(cell);
            });
        }

        function openFullscreenView() {
            buildFullscreenCourt();
            fullscreenView.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeFullscreenView() {
            fullscreenView.classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('btn-close-fullscreen').addEventListener('click', closeFullscreenView);
        document.getElementById('btn-open-fullscreen').addEventListener('click', openFullscreenView);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFullscreenView(); });

        // --- Umschalter Feld / Kader (wirkt nur im Handy-Layout) ---
        const tabFeld = document.getElementById('tab-feld');
        const tabKader = document.getElementById('tab-kader');

        function setView(view) {
            document.body.setAttribute('data-view', view);
            tabFeld.classList.toggle('active', view === 'feld');
            tabKader.classList.toggle('active', view === 'kader');
        }
        tabFeld.addEventListener('click', () => setView('feld'));
        tabKader.addEventListener('click', () => setView('kader'));

        // Wischgeste auf dem Spielfeld: nach links öffnet die Grossanzeige
        const courtEl = document.getElementById('court');
        let swipeStartX = null, swipeStartY = null, swipeFired = false, suppressCourtClick = false;

        // Wird schon während der Bewegung ausgewertet. Würde man bis zum Loslassen warten,
        // käme auf Android oft nur ein "pointercancel" an, sobald der Browser die Geste als Scrollen deutet.
        function trackSwipe(x, y) {
            if (swipeStartX === null || swipeFired) return;
            const dx = x - swipeStartX;
            const dy = y - swipeStartY;
            if (dx < -55 && Math.abs(dx) > Math.abs(dy) * 1.2) {
                swipeFired = true;
                suppressCourtClick = true;   // verhindert, dass der Wisch eine Position öffnet
                openFullscreenView();
            }
        }

        courtEl.addEventListener('pointerdown', (e) => {
            swipeStartX = e.clientX;
            swipeStartY = e.clientY;
            swipeFired = false;
            suppressCourtClick = false;   // Sperre gilt nur für den Klick direkt nach einem Wisch
            // Pointer einfangen, damit die Bewegung auch ausserhalb des Felds noch ankommt
            try { courtEl.setPointerCapture(e.pointerId); } catch (err) { /* nicht unterstützt */ }
        });
        courtEl.addEventListener('pointermove', (e) => trackSwipe(e.clientX, e.clientY));
        courtEl.addEventListener('pointerup', (e) => { trackSwipe(e.clientX, e.clientY); swipeStartX = null; });
        courtEl.addEventListener('pointercancel', () => { swipeStartX = null; });
        courtEl.addEventListener('click', (e) => {
            if (suppressCourtClick) { suppressCourtClick = false; e.stopPropagation(); e.preventDefault(); }
        }, true);

        // In der Grossanzeige schliesst ein Wisch in beliebige Richtung.
        // (Das Bild ist gedreht, deshalb ist "nach rechts" dort keine feste Bildschirmachse.)
        let fsStartX = null, fsStartY = null, fsFired = false;

        function trackFsSwipe(x, y) {
            if (fsStartX === null || fsFired) return;
            if (Math.hypot(x - fsStartX, y - fsStartY) > 55) {
                fsFired = true;
                closeFullscreenView();
            }
        }

        fullscreenView.addEventListener('pointerdown', (e) => {
            fsStartX = e.clientX; fsStartY = e.clientY; fsFired = false;
            try { fullscreenView.setPointerCapture(e.pointerId); } catch (err) { /* nicht unterstützt */ }
        });
        fullscreenView.addEventListener('pointermove', (e) => trackFsSwipe(e.clientX, e.clientY));
        fullscreenView.addEventListener('pointerup', (e) => { trackFsSwipe(e.clientX, e.clientY); fsStartX = null; });
        fullscreenView.addEventListener('pointercancel', () => { fsStartX = null; });

        // --- Reset Buttons ---
        function resetSlots(selector) {
            const slots = document.querySelectorAll(selector);
            const pool = document.getElementById('pool');
            slots.forEach(slot => {
                const playerCard = slot.querySelector('.player-card');
                if (playerCard) {
                    pool.appendChild(playerCard);
                    slot.classList.remove('warning');
                }
            });
            applyFilterAndSort();
            saveState();
        }

        document.getElementById('btn-reset-court').addEventListener('click', () => {
            resetSlots('#court .slot');
            rotationOffset = 0;            // leeres Feld immer in der Grundaufstellung zeigen
            applyRotationLabels();
            saveState();
        });
        document.getElementById('btn-reset-libero').addEventListener('click', () => resetSlots('#libero-slot-container .slot'));

        // --- PDF Export ---
        document.getElementById('btn-export-pdf').addEventListener('click', () => {
            const dateVal = document.getElementById('match-date').value;
            const opponentVal = document.getElementById('match-opponent').value.trim() || 'Gegner';
            const setVal = document.getElementById('match-set').value;

            const formattedDate = dateVal.replace(/-/g, '');
            const cleanOpponent = opponentVal.replace(/[^a-zA-Z0-9]/g, '_');
            const filename = `${formattedDate}_${cleanOpponent}_${setVal}.pdf`;

            const element = document.getElementById('export-area');

            const opt = {
                margin:       10,
                filename:     filename,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        });

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            setTodayDate();
            loadState();
        });

        // --- PWA: Service Worker Registrierung ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

    </script>
</body>
</html>
